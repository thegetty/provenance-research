    bio: "*C. Brian Rose* is the James B. Pritchard Professor of Archaeology at the University of Pennsylvania and curator-in-charge of the Mediterranean Section of the Penn Museum. He received his B.A. from Haverford College and his M.A., M.Phil., and Ph.D. from Columbia University. Between 1988 and 2012 he was head of post&ndash;Bronze Age excavations at Troy and English-language editor of **Studia Troica**. He has authored or edited four books on the archaeology of Troy and Gordion and another on dynastic commemoration in the early Roman Empire. Between 1994 and 2000 he was an academic trustee of the Archaeological Institute of America, then first vice-president (2002–6) and president (2007–11). He was deputy director of the Penn Museum between 2008 and 2011 and is a trustee of the American Academy in Rome."
