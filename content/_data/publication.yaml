# Title & Description
title: Provenance Research for Mediterranean Antiquities
subtitle: Methods and Resources
reading_line:
short_title:

description:
  one_line:
  full: "The first of its kind, this book is an accessible, comprehensive primer of methods and resources for researching the provenance of Mediterranean (Greek, Roman, and Etruscan) antiquities. In addition to outlining effective strategies for documentation and investigation, the volume features an annotated guide to key archives, databases, and twentieth-century dealers to facilitate a broad spectrum of research endeavors. Building upon a decade-long review of the Getty Museum’s antiquities collection, it draws together instructive case studies, legal perspectives, and practical experience to provide an efficient first point of reference for museum professionals, scholars, collectors, and students. The book aims to emphasize the need for diligent provenance research and to shorten the learning curve for such projects.<br/>The free online edition of this open-access publication is available at getty.edu/publications/provenance-research and includes zoomable illustrations. Also available are free PDF and EPUB downloads of the book."

