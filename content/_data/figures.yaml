figure_list:

  - id: "fig-1"
    src: "figures/fig-01.jpg"
    label: "Figure 1"
    zoom: true
    caption: "Detail of Linen Wrapping of Petosiris, son of Tetosiris, with Book of the Dead Spells, Egyptian, 300–100 BCE ([83.AI.47.1.1](https://www.getty.edu/art/collection/object/1061YT)), one of the twelve linen wrappings with texts and vignettes acquired by the Getty Museum in 1983."
    credit:
    alt: "Linen fragment showing a long, continuous illustration above three lines of text. The illustration shows people in profile in various scenes."

  - id: "fig-2-a"
    src: figures/fig-02-a.jpg
    label: "A"
    zoom: true
    # caption: "A: Fragment of Wrapping of Petosiris, son of Tetosiris, Egyptian, 300–100 BCE, linen, Teece Museum, Christchurch, New Zealand, James Logie Collection (121.73). B: Detail from a composite image showing the join between fragments (Getty Museum [83.AI.47.1.1](https://www.getty.edu/art/collection/object/105Z4V) at left; Teece Museum 121.73 at right)."
    # credit: "Photos: Foy D. Scalf / Courtesy Teece Museum of Classical Antiquities, University of Canterbury, Christchurch, New Zealand"
    alt: "Linen fragment showing a long, continuous illustration above three lines of text. The illustration shows people in profile walking with bulls and other animals."

  - id: "fig-2-b"
    src: figures/fig-02-b.jpg
    label: "B"
    # zoom: true
    alt: "Detail showing the right end of the linen fragment from Figure 1 and the left end of the linen fragment from Figure 2a side by side, nearly touching."

  - id: "fig-3"
    src: "figures/fig-03.jpg"
    label: "Figure 3"
    zoom: true
    caption: "Horses of San Marco, Roman, second century CE. Bronze, height: 171 cm (67 5/16 in.) at withers. Basilica of San Marco, Venice."
    credit: "Photo: © Per gentile concessione della Procuratoria di San Marco"
    alt: "Row of four bronze fourses standing side by side on raised platforms. Their surfaces are muted gold streaked with pale green patina. Each horse stands on three legs and lifts a front leg. The front leg that remains on the ground rests on top of a capital. In pairs, the horses turn their heads slightly in toward each other and raise the same foreleg."

  - id: "fig-4"
    src: "figures/fig-04.jpg"
    label: "Figure 4"
    zoom: true
    caption: "Laocoön and His Sons, by Athenodorus, Agesander, and Polydorus of Rhodes, early first century CE. Parian marble, 208 x 163 x 112 cm (81 7/8 x 64 3/16 x 44 1/6 in.). Vatican Museums, MV.1059.0.0."
    credit: "Photo: © Governatore of the Vatican City State-Directorat of the Vatican Museums"
    alt: "Marble sculpture of a muscular, bearded man writhing as snakes wrap around his body. Two younger men, smaller in scale, stand to either side of the main figure, also struggling with the snakes."

  - id: "fig-5"
    src: "figures/fig-05.jpg"
    label: "Figure 5"
    zoom: true
    caption: "Athenian red-figure calyx krater, ca. 515 BCE. Signed by Euxitheos and Euphronios. Terracotta, height: 45.7 cm (18 in.); diameter
      top: 55.1 cm (21 11/16 in.); diameter base: 29.5 cm (11 5/8 in.). Cerveteri,
      Museo Nazionale Archeologico Nazionale di Cerveteri, vase no. 187, inv. no. 145139."
    credit: "Photo: Scala / Ministero per i Beni e le Attività culturali / Art Resource, NY"
    alt: "Terracotta krater with a short foot, tall sides that flare widely, and two upward curving handles. The surface of the vessel is decorated with outlines of a scene on a black background. Three men stand around a prone, naked man, who bleeds from wounds in his chest, abdomen, and upper thigh. He is being supported by two winged, bearded figures with helmets on their heads."

  - id: "fig-6-a"
    src: figures/fig-06-a.jpg
    label: "A"
    zoom: true
    # caption: "Three gems from a group of 218 Greek, Roman, Etruscan Engraved Gems and Rings, ([81.AN.76](https://www.getty.edu/art/collection/object/103TYX)), each with different collecting histories (pictured: Engraved Scarab with Head of a Gorgon, Greek, ca. 500 BCE, cornelian, ([81.AN.76.3](https://www.getty.edu/art/collection/object/103TYV)); Engraved Scaraboid with Chimera, Greek, ca. 400 BCE, blue chalcedony, ([81.AN.76.49](https://www.getty.edu/art/collection/object/103TZR)); Engraved Scarab with Bes Fighting a Griffin, Phoenician, ca. 500 BCE, ([81.AN.76.110](https://www.getty.edu/art/collection/object/103V0D)))."
    # credit: ""
    alt: "'Orange oval gem engraved with a round face with five snakes reaching from the top of the head and two extending out from the chin. The figure''s eyes are wide open and the mouth is pulled back in a toothy smile. The edge of the stone features linear incisions.'"

  - id: "fig-6-b"
    src: figures/fig-06-b.jpg
    label: "B"
    zoom: true
    alt: "Blue oval gem engraved with a lion in profile facing the right and lifting one front paw as if mid-stride. It has the head, long neck, and front legs of a deer-like animal emerging from its shoulders."

  - id: "fig-6-c"
    src: figures/fig-06-c.jpg
    label: "C"
    zoom: true
    alt: "Green oval gem engraved with a standing person who is depicted fighting a griffin. The griffin features a lion’s body, wings, and the head of a bird of prey. The person has a long headdress and a rounded nose."

  - id: "fig-7"
    src: "figures/fig-07.jpg"
    label: "Figure 7"
    zoom: true
    caption: "Suggested workflow for provenance research."
    credit: ""
    alt: "Chart showing a workflow for provenance research that begins with quote Collect primary documentation end quote. A horizontal line leads to four boxes arranged vertically, but another box reaching off the horizonal connector reads, quote Review and record object data end quote. Of the four boxes, the topmost reads, quote Examine the object itself end quote. From here, a line reaches out and bifurcates in two boxes arranged vertically that read, quote Stickers, marks, numbers, text end quote and quote Conservation history end quote. The next two of the four boxes read quote Review known bibliography end quote and quote Investigate new resources end quote. Two lines reach from this pair of boxes leading to three that read quote Typological and iconographic catalogues end quote, quote Sale catalogues end quote, and quote Archives end quote. The last of the four boxes reads quote Research previous owners end quote, which in turn leads to quote Dealer advertisements end quote and quote Collection catalogues end quote. A bracket reaching across the chart is connected to a box labeled quote Use to draft the object provenance narrative end quote."

  - id: "fig-8"
    src: "figures/fig-08.jpg"
    label: "Figure 8"
    zoom: true
    caption: "Brummer collection stickers from marble Herm of Hermes ([79.AA.132](https://www.getty.edu/art/collection/object/103TQG))."
    credit: ""
    alt: "Labels with inventory numbers. One of two stickers reads quote 627 end quote in unevenly inked numbers. The second reads, quote Collection Ernest Brummer end quote in all caps and arranged in a semi-circle. The numbers 4732 and the letter P are written underneath in a shaky hand."

  - id: "fig-9-a"
    src: figures/fig-09-a.jpg
    label: "A"
    zoom: true
    # caption: "Cahn collection numbers (777 and 778) preserved on two Attic Red-Figure Psykter Fragments, Greek, about 510 BCE, terracotta ([98.AE.98.1](https://www.getty.edu/art/collection/object/108DEJ)) and ([98.AE.98.2](https://www.getty.edu/art/collection/object/108DEK))."
    # credit: ""
    alt: "A roughly diamond-shaped pottery fragment with sharp edges and two numbers written on its surface. The number 777 is in red in the top left, and the label quote 98.AE.98.1 end quote is placed near the right tip in black."

  - id: "fig-9-b"
    src: figures/fig-09-b.jpg
    label: "B"
    zoom: true
    alt: "Terracotta fragment shaped in the form of a wide triangle with a spur at the top left. It has two numbers written on its surface: the label quote 98.AE.98.2 end quote is written in black to the left, and the number 778 is in red to the right."

  - id: "fig-10"
    src: "figures/fig-10.jpg"
    label: "Figure 10"
    zoom: true
    caption: "Underside of Cypriot Black on Red Ware Plate, ca. 550–450 BCE, terracotta ([94.AE.114.2](https://www.getty.edu/art/collection/object/10409Z)) showing export number (2801)."
    credit: ""
    alt: "Bottom of a red terracotta plate decorated with now-faded black bands around the foot. Within the foot are two intersecting patterned bands made up of diamond-shaped hatching. The plate has two handles, one on each side, and the number 2801 is written in pencil halfway up the body."

  - id: "fig-11-a"
    src: "figures/fig-11-a.jpg"
    label: "A"
    zoom: true
    # caption: "A (front): Statuette of an Ape with Its Baby, Greek (Boeotian), mid-6th century BCE ([76.AD.16](https://www.getty.edu/art/collection/object/103T3X)). B (bottom): Underside of Statuette of an Ape with Its Baby ([76.AD.16](https://www.getty.edu/art/collection/object/103T3X)), showing price label."
    # credit: ""
    alt: "A red clay statuette shaped in the form of an ape sitting with its arms reaching out and down in an arc to the feet or knees. An upside-down triangular head features incised eyes, nose, and a mouth. A second tiny head perches at the top."

  - id: "fig-11-b"
    src: figures/fig-11-b.jpg
    label: "B"
    zoom: true
    alt: "The underside of the ape statuette showing a number written in black. A white price label with the pound symbol and the number 110 in green ink is affixed near the written number quote 76.AD.16 end quote."

  - id: "fig-12-a"
    src: "figures/fig-12-a.jpg"
    label: "A"
    zoom: true
    # caption: "A: Cameo with Hercules and Diomedes, Roman, 25 BCE–14 CE, sardonyx set in a modern gold mount ([2023.19](https://www.getty.edu/art/collection/object/1146B1)). B: Detail of ownership engraving on Cameo with Hercules and Diomedes (2023.19)."
    # credit: ""
    alt: "A honey-yellow cameo with a white upper layer showing two men and a horse in low relief. A nude man raises a club high over his head as he holds the rearing horse by its mane. The second man sits to the left of the scene and wraps one arm around the leg of the first. The cameo is set in a round gold frame."

  - id: "fig-12-b"
    src: figures/fig-12-b.jpg
    label: "B"
    zoom: true
    alt: "'Detail of the cameo shown in Figure 12a. Incised in the yellow stone above the main figure''s forearm are the letters E and D. The section to the immediate left of the inscription is missing but a small segment of an additional letter can be seen.'"

  - id: "fig-13"
    src: figures/fig-13.jpg
    label: "Figure 13"
    zoom: true
    caption: "Sir Charles Alfred William Rycroft monogram preserved under the handle of Attic Red-Figure Kylix, Greek, ca. 480 BCE, terracotta ([82.AE.42](https://www.getty.edu/art/collection/object/103VA6))."
    credit: ""
    alt: "White label with a ligature and a number painted in white against a black and red background. The letter W has a letter C hooked around the left leg, as the right leg creates the backbone of a letter R. The upside-down V made in the W is turned into an A with the addition of a crossbar. The number 116 is immediately below."

  - id: "fig-14"
    src: "figures/fig-14.jpg"
    label: "Figure 14"
    zoom: true
    caption: "Dietrich von Bothmer label on the underside of Pitcher (*epichysis*), Greek, fourth century BCE, terracotta ([96.AE.227](https://www.getty.edu/art/collection/object/107SAX))."
    credit: ""
    alt: "Underside of a ceramic vessel with a label written in black at the top that reads quote 96AE227 end quote. A white sticker at the center reads, in handwritten blue ink, quote ex Harmer Johnson, 3 May 1978 end quote."

  - id: "fig-15"
    src: "figures/fig-15.jpg"
    label: "Figure 15"
    zoom: true
    caption: "Dietrich von Bothmer label on Attic Black-Figure Band Skyphos Fragment, Greek, ca. 540–530 BCE, terracotta ([85.AE.446](https://www.getty.edu/art/collection/object/103VW7))."
    credit: ""
    alt: "Close view of a black ceramic fragment. A white sticker with typed text reading quote REH 084 end quote is affixed to its surface."

  - id: "fig-16"
    src: figures/fig-16.jpg
    label: "Figure 16"
    zoom: true
    caption: "Detail of the underside of Campanian Neck Amphora, early fifth century BCE, terracotta ([82.AE.128](https://www.getty.edu/art/collection/object/103VCR))."
    credit: ""
    alt: "Underside of a ceramic vessel with three written inscriptions. Following the curve of the vessel’s foot is text in pencil that reads quote Found by myself at an excavation at Nola end quote. Also in pencil and closer to the center is the number 100, which is underlined. Between the two inscriptions is inked text reading quote 82 AE.128 end quote."

  - id: "fig-17"
    src: "figures/fig-17.jpg"
    label: "Figure 17"
    zoom: true
    caption: "Sticker on base of Statuette of a Bird with Two Chicks, Greek (Boeotian), late sixth century BCE, terracotta ([96.AD.228](https://www.getty.edu/art/collection/object/107SB2))."
    credit: ""
    alt: "Close-up view of a sticker on a textured ceramic surface. The ink is faded which makes the five lines of text on it difficult to make out aside from the letter G at the top right, the phrase quote sixth cent end quote on the third line, and the word Beotia near the bottom."

  - id: "fig-18"
    src: "figures/fig-18.jpg"
    label: "Figure 18"
    zoom: true
    caption: "Export seal preserved on underside of Attic Red-Figure Askos, Greek, ca. 410 BCE, terracotta ([83.AE.396](https://www.getty.edu/art/collection/object/103VHP)). The significance of other markings is still to be determined."
    credit: ""
    alt: "Underside of a ceramic vessel featuring several numbers and labels in black ink and a red wax seal. The seal is preserved partially to the right of the base, with an oval shield at the center encircled by rings of decorative marks and text."

  - id: "fig-19"
    src: "figures/fig-19.jpg"
    label: "Figure 19"
    zoom: true
    caption: "Detail of the reverse of Funerary Portrait of a Woman, Romano-Egyptian, ca. 175–200 CE, tempera on wood ([79.AP.129](https://www.getty.edu/art/collection/object/103TQE)), showing one of the partially-preserved Austrian export stamps (dark ink, triangle-shaped). Other markings include a set of numbers, “109 / 167,” which may relate to the panel's sale in 1942 at the Kende Galleries, where it was lot 167."
    credit: "Photo: Marie Svoboda, J. Paul Getty Museum"
    alt: "'A partial triangular stamp and two numbers written in pencil on a wooden panel. The center of the triangular stamp did not ink fully onto the wood grain, but a few letters are legible although they don''t make complete words.'"

  - id: "fig-20-a"
    src: figures/fig-20-a.jpg
    label: "A"
    zoom: true
    # caption: "Statuette of a Sacrificing Woman, Etruscan, fourth–third centuries BCE, bronze ([78.AB.408.1](https://www.getty.edu/art/collection/object/105Y7A)), front and back; collector’s marks on the back."
    # credit: ""
    alt: "Bronze statuette showing a woman wearing a long garment and a headdress. She holds a round object out with her hand and a smaller dish-like object in her left. The pitted surface of the figure is streaked heavily with a green patina."

  - id: "fig-20-b"
    src: figures/fig-20-b.jpg
    label: "B"
    zoom: true
    alt: "The back of the bronze statuette shown in Figure 20a. Two instances of white text are shown. Four lines oriented sideways in the center read quote Tomb Ovieto Italy 1.9.HF end quote, with the H and F conjoined. More white text along the bottom hem of the garment features an alphanumberic label."

  - id: "fig-21"
    src: "figures/fig-21.jpg"
    label: "Figure 21"
    # zoom: true
    caption: "Detail of the purchaser of Lot 74 from Sotheby’s sale catalogue. Price list for Sotheby’s Antiquities sale in London on July 22, 1963: “74 Weiner, M.H. 50 140.00.”"
    credit: "Photo: Courtesy of Sotheby’s"
    alt: "Detail of a line of black printed text arranged in four columns."

  - id: "fig-22"
    src: "figures/fig-22.jpg"
    label: "Figure 22"
    zoom: true
    caption: "Imitation of a Statuette of Crouching Aphrodite, twentieth century CE, terracotta (57.AD.9)."
    credit: ""
    alt: "Terracotta statuette of a nude woman crouching and holding both arms across her chest. In this view, her body is angled to our right and her head tips to one side. Her hair is parted down the middle and pulled back."

  - id: "fig-23-a"
    src: "figures/fig-23-a.jpg"
    label: "A"
    zoom: true
    # caption: "A: Statue of a Draped Woman, Roman, ca. 160–190 CE, marble ([72.AA.153](https://www.getty.edu/art/collection/object/103SP6)) at the time of its acquisition by the Getty Museum in 1972. B: Late nineteenth- or early twentieth-century photograph, D-DAI-ROM-EA-5022."
    # credit: "Photo: DEUTSCHES ARCHÄOLOGISCHES INSTITUT - ROM"
    alt: "Black-and-white photograph of a marble statue of a woman wearing a long robe that falls in meticulous, dense pleats and creases. The head and most of her arms are missing. She stands with her weight on one foot and the other knee slightly bent, and one arm is lifted out to the side."

  - id: "fig-23-b"
    src: "figures/fig-23-b.jpg"
    label: "B"
    zoom: true
    alt: "'Slightly blurry black-and-white photograph of the statue shown in Figure 23a but including the head and arms. The head is draped with a cloth, the right arm is extended by the side of the woman''s body, and the left holds up a cylindrical object, perhaps a fragment of an originally larger piece.'"

  - id: "fig-24-a"
    src: figures/fig-24-a.jpg
    label: "A"
    zoom: true
    # caption: "A: Cinerary Urn with the Plow Hero. B: Cinerary Urn Lid with a Reclining Man, Etruscan, 150–100 BCE, terracotta ([71.AD.293](https://www.getty.edu/art/collection/object/105XDH))."
    # credit: ""
    alt: "View of one of the long sides of a terracotta trough-shaped urn. It shows a scene molded in relief with five people locked together in a struggle. A standing person prods a prone one with the end of a plowshare, which is as tall as him and has a hook reaching back at a sharp angle. Two of the people hold round shields, including the one on the ground."

  - id: "fig-24-b"
    src: figures/fig-24-b.jpg
    label: "B"
    zoom: true
    alt: "Rectangular terracotta lid showing a reclining person with one elbow propped on a pillow. The person’s hips tip toward the front and the shoulders, to the right of the image, are squared to the viewer as the person looks up and to the right. They have short-cropped hair and wear a long toga that falls off one shoulder."

  - id: "fig-25"
    src: "figures/fig-25.jpg"
    label: "Figure 25"
    zoom: true
    caption: "Online collection catalogue, provenance page of Cinerary Urn and Lid (71.AD.293)."
    credit: ""
    alt: "Screenshot of the Getty online collection catalogue showing the entry for the terracotta urn and lid shown in Figure 24. The Provenance tab has fields with dates, owners, galleries, and notes about how the object changed hands over the years. Links for Provenance, Bibliography, and Exhibitions are to the left. The work’s title, artist information, and a thumbnail image of the urn are in the upper right."

  - id: "fig-26"
    src: "figures/fig-26.jpg"
    label: "Figure 26"
    zoom: true
    caption: "Situla with a Frieze of Athletic Contests, Roman, 75–100 CE, bronze ([96.AC.41](https://www.getty.edu/art/collection/object/10402V))."
    credit: ""
    alt: "Bronze bowl with a rounded body and narrow neck and foot. Scenes in high relief decorate its sides. Two people appear wrestling on the side that faces the viewer. The surface gleams and has a green patina in areas."

  - id: "fig-27"
    src: "figures/fig-27.jpg"
    label: "Figure 27"
    zoom: true
    caption: "Frontispiece from Charles Patin’s *Familiae Romanae in antiquis numismatibus* (1663), with engraving of the situla (96.AC.41) at the bottom left. Los Angeles, Getty Research Institute 84-B8630."
    credit: ""
    alt: "Engraving showing a scene in which three figures in the foreground hold or lean toward the bowl illustrated in Figure 26. Two of the figures have wings and the third wears a winged helmet. A partially buried stone fragment at their feet reads quote Familia Romanae end quote. More people gather in the background among stone buildings and statues."

  - id: "fig-28"
    src: "figures/fig-28.jpg"
    label: "Figure 28"
    zoom: true
    caption: "Drawing of the situla (96.AC.41) by Pierre Jacques of Reims. Bibliothèque nationale de France, Paris, Codex Remensis, fol. 60. Reproduced in Reinach 1902. Los Angeles, Getty Research Institute 93-B23801."
    credit: ""
    alt: "Drawing showing the actions taking place on the bowl shown in Figure 26 as if rolled out onto a flat surface in two registers. In both strips, pairs of people grapple with each other separated by urns on pedestals. A drawing of an animal, perhaps a bear or lion, appears in the lower right corner of the sheet."

  - id: "fig-29"
    src: "figures/fig-29.jpg"
    label: "Figure 29"
    zoom: true
    caption: "Page from the Knoedler Gallery Stockbooks, showing no. 8026, a Cycladic Idol, 2500 BCE. Painting stock book 11: A7178-A9437, February 1959–December 1970. Los Angeles, Getty Research Institute 2012.M.54 (bx.11)."
    credit: ""
    alt: "Two pages of an open ledger book have names and locations written in cursive down the left side and notations under columns titled quote Cost end quote, quote Charges end quote, and quote Sold For end quote. Additional notes are added in a few places in red, and red check marks are next to most entries. The page number is printed in blue at the top left and top right corners of the spread. The date for the year 1961 is handwritten at the top of the left page. In the entries that follow, not all columns are filled out with information."

  - id: "fig-30"
    src: "figures/fig-30.jpg"
    label: "Figure 30"
    zoom: true
    caption: "Head of Venus (Crouching Aphrodite type), Roman, first–second century CE, marble ([73.AA.125](https://www.getty.edu/art/collection/object/105XKE))."
    credit: ""
    alt: "Fragment of a sculpted head showing a woman’s face from just above the eyebrows to the throat. Carved from cream-white marble, the face turns slightly to the right. The nose and part of the mouth have been lost."

  - id: "fig-31"
    src: "figures/fig-31.jpg"
    label: "Figure 31"
    zoom: true
    caption: "Brummer Gallery card P2328 (recto). Handwritten notes include the object description, “Marble head; upper part missing / Greek”; the date the object arrived at the Brummer Gallery in New York, “Arr. Nov. 5, 1925”; and the sale date in red ink at center, “Sold to George H. Myers, March 4, 1927, $2200.”"
    credit: "Photo: Brummer Gallery Records, © The Metropolitan Museum of Art / Art Resource, NY"
    alt: "Piece of paper with a sketch of the head shown in Figure 30 to the left and overlapping handwritten, cursive notes in red and black ink filling the rest of the sheet. Black writing to the right reads quote Marble head; upper part missing, Greek. Little smaller than life size. Arrival November 5, 1925 end quote. Red text written across the black reads quote Sold to George H. Myers, March 4, 1927, 2200 dollars end quote."

  - id: "fig-32"
    src: "figures/fig-32.jpg"
    label: "Figure 32"
    zoom: true
    caption: "Statuette of a Horse and Rider, Greek (Boeotian), seventh century BCE, terracotta ([2002.85](https://www.getty.edu/art/collection/object/109219))."
    credit: ""
    alt: "Terracotta statuette shaped into a simplified horse form with dark, parallel dashes. A person, smaller in scale than the animal, is on the horse’s back and clutches the mane. Their bodies meld together as the rider emerges from the back of the horse."

  - id: "fig-33"
    src: "figures/fig-33.jpg"
    label: "Figure 33"
    zoom: true
    caption: "Horse and rider, DAI Rome Microfiche 1768_D14. D-DAI-Rom 34.5865 (source: https://arachne.dainst.org/entity/710155)."
    credit: "Photo: Courtesy Heidelberg Archaeological Institute/DEUTSCHES ARCHÄOLOGISCHES INSTITUT - ROM"
    alt: "Scan of a black-and-white microfiche film showing the terracotta statuette shown in Figure 32. The number 5865 is written in the lower left corner of the image, and to its left, the number 1934 is printed. The phrase quote PRIVATBESITZ end quote appears below. A seal repeats faintly in the background of the film like a watermark."

  - id: "fig-34"
    src: "figures/fig-34.jpg"
    label: "Figure 34"
    zoom: true
    caption: "DAI Rome Arachne Inventarbuch entry for Horse and Rider. D-DAI-Rom 5865 (source: https://arachne.dainst.org/entity/1572804)."
    credit: "Photo: DEUTSCHES ARCHÄOLOGISCHES INSTITUT - ROM"
    alt: "The pages of an open inventory have handwritten entries under various columns. The year 1943 is written in the center at the top of the spread. Photo numbers span from 5855 to 5867."

  - id: "fig-35"
    src: "figures/fig-35.jpg"
    label: "Figure 35"
    zoom: true
    caption: "Portrait bust of a Man, Roman, 140–160 CE, marble ([2018.31](https://www.getty.edu/art/collection/object/109P06))."
    credit: ""
    alt: "Marble bust showing the head, shoulders, and chest of a bearded man with short, curly hair. His lips are pulled tight and there are pouches on his cheeks under his eyes. His chest is bare except for a cloak pinned over his left shoulder. The bust rests on a round pedestal foot."

  - id: "fig-36"
    src: "figures/fig-36.jpg"
    label: "Figure 36"
    zoom: true
    caption: "Page 16 from Gabriel Saint-Aubin’s annotated copy of the 1775 Mariette sale, with drawings of lots. Number 94 is the Getty gem with Venus and Anchises ([2017.2](https://www.getty.edu/art/collection/object/109NAS)). William A. Sargent Collection—Bequest of William A. Sargent. Museum of Fine Arts, Boston, 37.1713.16."
    credit: "Photo: © 2026 Museum of Fine Arts, Boston"
    alt: "Seven cameos appear sketched lightly down the wide left margin of a page printed with French text. The sheet shown is page 16 and is headed with the section title quote Pierres gravées end quote. It includes descriptions in French for item numbers 91 through 96."

  - id: "fig-37"
    src: "figures/fig-37.jpg"
    label: "Figure 37"
    zoom: true
    caption: "Illustration in 1905 auction catalogue with the Getty’s Portrait of a Man ([74.AA.63](https://www.getty.edu/art/collection/object/103T09)) in the center, Fifth Avenue Art Galleries 1905, lot 622."
    credit: "Photo: © The Metropolitan Museum of Art / Art Resource, NY"
