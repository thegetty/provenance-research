  - id: "fig-4"
    src: "figures/fig-04.jpg"
    label: "Figure 4"
    zoom: true
    caption: "Laocoön and His Sons, by Athanodorus, Agesander, and Polydorus of Rhodes, 40–20 BCE. Parian marble, 208 x 163 x 112 cm (81 7/8 x 64 3/16 x 44 1/6 in.). Vatican Museums, MV.1059.0.0."
    credit: "Photo: © Governatore of the Vatican City State-Directorat of the Vatican Museums"
  
  - id: "fig-5"
    src: "figures/fig-05.jpg"
    label: "Figure 5"
    zoom: true
    caption: "Euphronios Krater, red-figure calyx-krater, Attic Greek, ca. 515 BCE.
      Obverse (side A): Body of Sarpedon lifted by Hypnos and Thanatos in the
      presence of Hermes, Leodamas, and Hippolytos. Signed by Euxitheos (potter)
      and by Euphronios (painter). Terracotta, height: 45.7 cm (18 in.); diameter
      top: 55.1 cm (21 11/16 in.); diameter base: 29.5 cm (11 5/8 in.). Cerveteri,
      Museo Nazionale Archeologico Nazionale di Cerveteri, vase no. 187, inv. no.
      TK."
    credit: "Photo: Scala / Ministero per i Beni e le Attività culturali / Art Resource, NY"
  
